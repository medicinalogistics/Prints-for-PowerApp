<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zebra Shipment Labels</title>
    <style>
        /* Updated to 15cm width and 10cm height */
        @page { size: 15cm 10cm; margin: 0; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #fff; }
        
        /* Flexbox row layout for side-by-side design */
        .qr-item {
            width: 15cm; height: 10cm;
            display: flex; flex-direction: row;
            align-items: center;
            box-sizing: border-box;
            padding: 8mm; page-break-after: always; gap: 8mm;
        }
        
        .left-col {
            display: flex; justify-content: center; align-items: center;
        }
        
        /* Scaled up QR code to fit the larger paper */
        .qr-item img { width: 5.5cm; height: 5.5cm; object-fit: contain; }
        
        .right-col {
            display: flex; flex-direction: column; justify-content: center; align-items: flex-start; text-align: left;
            flex: 1; height: 100%;
        }
        
        .header-store { font-size: 12pt; font-weight: 800; text-transform: uppercase; margin-bottom: 3mm; color: #4B5563; }
        
        /* Much larger and bolder Pharmacy Name */
        .pharmacy-name { font-size: 26pt !important; font-weight: 900; margin-bottom: 3mm; line-height: 1.1; color: #111827; }
        
        .container-info { font-size: 16pt; font-weight: 700; color: #000; margin-bottom: 2mm; }
        
        .tr-numbers { font-size: 11pt; max-width: 100%; word-break: break-word; line-height: 1.3; color: #374151; }
        
        @media print { body { margin: 0; } .qr-item { page-break-after: always; break-after: page; } }
    </style>
</head>
<body>
    <div id="qrContainer">Loading labels...</div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('data');
        const qrContainer = document.getElementById('qrContainer');

        if (!dataParam) {
            qrContainer.innerHTML = 'Error: No data found.';
        } else {
            try {
                const qrData = JSON.parse(decodeURIComponent(dataParam));
                qrContainer.innerHTML = '';
                
                qrData.forEach(item => {
                    const qrCodeURL = "https://api.qrserver.com/v1/create-qr-code/?data=" + 
                                     encodeURIComponent(item.BarcodeID) + "&size=400x400";
                    
                    let rawTRString = "";
                    if (Array.isArray(item.TRNo)) {
                        rawTRString = item.TRNo.join(',');
                    } else if (typeof item.TRNo === 'string') {
                        rawTRString = item.TRNo;
                    } else {
                        rawTRString = String(item.TRNo || '');
                    }

                    let trArray = rawTRString.split(/[\n,]+/).map(tr => tr.trim()).filter(tr => tr !== '');
                    let uniqueTRs = [...new Set(trArray)];
                    let displayTRs = uniqueTRs.join(', ');

                    // Updated HTML structure separating left (QR) and right (Text)
                    const div = document.createElement('div');
                    div.className = 'qr-item';
                    div.innerHTML = `
                        <div class="left-col">
                            <img src="${qrCodeURL}">
                        </div>
                        <div class="right-col">
                            <div class="header-store">Medicina Drug Store</div>
                            <div class="pharmacy-name">${item.PharmacyName || ''}</div>
                            <div class="container-info">${item.ContainerInfo || ''}</div>
                            <div class="tr-numbers"><strong>TR's:</strong> ${displayTRs}</div>
                        </div>
                    `;
                    qrContainer.appendChild(div);
                });
            } catch (e) { 
                qrContainer.innerHTML = 'Error parsing data.'; 
            }
        }
    </script>
</body>
</html>
