<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zebra Shipment Labels</title>
    <style>
        /* Force Landscape Page Size */
        @page { size: 15cm 10cm; margin: 0; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #fff; }
        
        /* Main Container: Exactly 15x10cm */
        .qr-item {
            width: 15cm; 
            height: 10cm;
            display: flex; 
            flex-direction: row;
            box-sizing: border-box;
            page-break-after: always; 
            page-break-inside: avoid;
            overflow: hidden;
        }
        
        /* Left Box: Exactly 5cm wide */
        .left-box {
            width: 5cm;
            height: 10cm;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* QR Code fits perfectly inside the 5cm box minus the 10px padding */
        .left-box img { 
            width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
        }
        
        /* Right Box: Exactly 10cm wide */
        .right-box {
            width: 10cm;
            height: 10cm;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            text-align: left;
        }
        
        /* Text Styling */
        .header-store { font-size: 12pt; font-weight: 800; text-transform: uppercase; margin-bottom: 2mm; color: #4B5563; }
        .pharmacy-name { font-size: 24pt; font-weight: 900; margin-bottom: 2mm; line-height: 1.1; color: #111827; }
        .container-info { font-size: 16pt; font-weight: 700; color: #000; margin-bottom: 2mm; }
        .tr-numbers { font-size: 11pt; width: 100%; word-break: break-word; line-height: 1.2; color: #374151; }
        
        @media print { 
            body { margin: 0; -webkit-print-color-adjust: exact; } 
            .qr-item { page-break-after: always; break-after: page; } 
        }
    </style>
</head>
<body>
    <div id="qrContainer">Loading labels...</div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('data');
        const qrContainer = document.getElementById('qrContainer');

        if (!dataParam) {
            qrContainer.innerHTML = 'Error: No data found.';
        } else {
            try {
                const qrData = JSON.parse(decodeURIComponent(dataParam));
                qrContainer.innerHTML = '';
                
                qrData.forEach(item => {
                    const qrCodeURL = "https://api.qrserver.com/v1/create-qr-code/?data=" + 
                                     encodeURIComponent(item.BarcodeID) + "&size=400x400";
                    
                    let rawTRString = "";
                    if (Array.isArray(item.TRNo)) {
                        rawTRString = item.TRNo.join(',');
                    } else if (typeof item.TRNo === 'string') {
                        rawTRString = item.TRNo;
                    } else {
                        rawTRString = String(item.TRNo || '');
                    }

                    let trArray = rawTRString.split(/[\n,]+/).map(tr => tr.trim()).filter(tr => tr !== '');
                    let uniqueTRs = [...new Set(trArray)];
                    let displayTRs = uniqueTRs.join(', ');

                    const div = document.createElement('div');
                    div.className = 'qr-item';
                    div.innerHTML = `
                        <div class="left-box">
                            <img src="${qrCodeURL}">
                        </div>
                        <div class="right-box">
                            <div class="header-store">Medicina Drug Store</div>
                            <div class="pharmacy-name">${item.PharmacyName || ''}</div>
                            <div class="container-info">${item.ContainerInfo || ''}</div>
                            <div class="tr-numbers"><strong>TR's:</strong> ${displayTRs}</div>
                        </div>
                    `;
                    qrContainer.appendChild(div);
                });
            } catch (e) { 
                qrContainer.innerHTML = 'Error parsing data.'; 
            }
        }
    </script>
</body>
</html>
