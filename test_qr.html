<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zebra Shipment Labels</title>
    <style>
        /* Set page to Vertical Portrait: 10cm width, 15cm height */
        @page { size: 10cm 15cm; margin: 0; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #fff; }
        
        /* Flexbox column layout for Top-to-Bottom design */
        .qr-item {
            width: 10cm; 
            height: 15cm;
            display: flex; 
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            padding: 8mm; 
            page-break-after: always; 
        }
        
        .header-store { 
            font-size: 14pt; 
            font-weight: 800; 
            text-transform: uppercase; 
            margin-bottom: 5mm; 
            margin-top: 2mm;
            color: #4B5563; 
        }
        
        /* Scaled up QR code for vertical layout */
        .qr-item img { 
            width: 7cm; 
            height: 7cm; 
            object-fit: contain; 
            margin-bottom: 5mm;
        }
        
        /* Pharmacy Name */
        .pharmacy-name { 
            font-size: 24pt !important; 
            font-weight: 900; 
            margin-bottom: 3mm; 
            line-height: 1.1; 
            color: #111827; 
            width: 100%;
        }
        
        .container-info { 
            font-size: 16pt; 
            font-weight: 700; 
            color: #000; 
            margin-bottom: 4mm; 
        }
        
        .tr-numbers { 
            font-size: 12pt; 
            width: 100%;
            word-break: break-word; 
            line-height: 1.3; 
            color: #374151; 
        }
        
        @media print { 
            body { margin: 0; -webkit-print-color-adjust: exact; } 
            .qr-item { page-break-after: always; break-after: page; } 
        }
    </style>
</head>
<body>
    <div id="qrContainer">Loading labels...</div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('data');
        const qrContainer = document.getElementById('qrContainer');

        if (!dataParam) {
            qrContainer.innerHTML = 'Error: No data found.';
        } else {
            try {
                const qrData = JSON.parse(decodeURIComponent(dataParam));
                qrContainer.innerHTML = '';
                
                qrData.forEach(item => {
                    const qrCodeURL = "https://api.qrserver.com/v1/create-qr-code/?data=" + 
                                     encodeURIComponent(item.BarcodeID) + "&size=400x400";
                    
                    let rawTRString = "";
                    if (Array.isArray(item.TRNo)) {
                        rawTRString = item.TRNo.join(',');
                    } else if (typeof item.TRNo === 'string') {
                        rawTRString = item.TRNo;
                    } else {
                        rawTRString = String(item.TRNo || '');
                    }

                    let trArray = rawTRString.split(/[\n,]+/).map(tr => tr.trim()).filter(tr => tr !== '');
                    let uniqueTRs = [...new Set(trArray)];
                    let displayTRs = uniqueTRs.join(', ');

                    // Vertical layout: Top to Bottom
                    const div = document.createElement('div');
                    div.className = 'qr-item';
                    div.innerHTML = `
                        <div class="header-store">Medicina Drug Store</div>
                        <img src="${qrCodeURL}">
                        <div class="pharmacy-name">${item.PharmacyName || ''}</div>
                        <div class="container-info">${item.ContainerInfo || ''}</div>
                        <div class="tr-numbers"><strong>TR's:</strong> ${displayTRs}</div>
                    `;
                    qrContainer.appendChild(div);
                });
            } catch (e) { 
                qrContainer.innerHTML = 'Error parsing data.'; 
            }
        }
    </script>
</body>
</html>
