<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Tracking Report</title>
    <style>
        /* Base reset to ensure a clean slate before Power Apps styles take over */
        body, html {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }
        
        /* Loading message style for when the script is processing */
        #loading-message {
            text-align: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin-top: 50px;
            color: #64748b;
        }

        /* Hide the loading message when actually printing */
        @media print {
            #loading-message {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="loading-message">Preparing your report for printing...</div>
    
    <!-- This container will hold the HTML injected from Power Apps -->
    <div id="report-container"></div>

    <script>
        window.onload = function() {
            // 1. Grab the URL parameters passed by the Power Apps Launch() function
            const urlParams = new URLSearchParams(window.location.search);
            const reportHTML = urlParams.get('reportData');

            // 2. Locate the container div
            const container = document.getElementById('report-container');
            const loadingMsg = document.getElementById('loading-message');

            if (reportHTML) {
                // 3. Inject the Power Apps HTML string into the page
                container.innerHTML = reportHTML;
                
                // Hide the loading text
                loadingMsg.style.display = 'none';

                // 4. Trigger the native browser print dialog automatically
                // A slight 500ms delay ensures all CSS and text are fully rendered before the dialog locks the screen
                setTimeout(() => {
                    window.print();
                }, 500);

            } else {
                // Fallback if someone opens the URL directly without clicking the button in Power Apps
                loadingMsg.innerHTML = "<h2>No report data found.</h2><p>Please launch this page directly from the Pharmacy Module Print Button.</p>";
                loadingMsg.style.color = "#b91c1c";
            }
        };

        // Optional: Automatically close the tab after the user prints or cancels the print dialog
        window.onafterprint = function() {
            window.close();
        };
    </script>
</body>
</html>
